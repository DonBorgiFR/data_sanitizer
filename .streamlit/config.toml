[server]
# Deshabilitar CORS y XSRF para evitar problemas de conexión en la nube
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50 # Aumentar límite a 50MB si es necesario procesar archivos industriales grandes

[theme]
# Colores corporativos basados en la identidad visual premium de DataSanitizer
primaryColor = "#1e3c72"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#212529"
font = "sans serif"

[client]
# Evitar mostrar tracebacks detallados en producción para mantener la sobriedad y seguridad
showErrorDetails = false
